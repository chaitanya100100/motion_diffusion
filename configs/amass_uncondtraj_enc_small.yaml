DATA:
  DATASET_NAME: amass
  REPRE_TYPE: v4_beta  # betas are inferred
  COND_BETAS: False  # betas are not provided as condition input
  COND_IMG_FEAT: False
  COND_TRAJ: False
  WINDOW: 80
  IMG_FEAT_TYPE: dinov2  # Not used here
  BATCH_SIZE: 64
  NUM_WORKERS: 8

MODEL:
  MODEL_NAME: uem
  ENCODER_TSFM: add
  MODEL_SIZE: small
  LEARN_TRAJ: True

TRAIN:
  WEIGHT_DECAY: 0.01
  LR: 3.e-5
  NUM_EPOCHS: 350
  SAVE_EVERY_N_EPOCHS: 50
  CHECK_VAL_EVERY_N_EPOCHS: 5
